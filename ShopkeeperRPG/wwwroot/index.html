<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopkeeper RPG - Character Creation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Create Your Character</h1>

    <div>
        <label for="playerNameInput">Character Name:</label>
        <input type="text" id="playerNameInput" placeholder="Enter character name">
    </div>

    <button id="createCharacterButton">Create Character</button>

    <div id="characterDisplay" style="margin-top: 20px;">
        <!-- Character details will be displayed here -->
    </div>

    <hr>
    <h2>Actions</h2>
    <button id="getStarterItemButton" style="margin-top: 10px;">Get Starter Item</button>
    <button id="visitMarketButton" style="margin-top: 10px;">Visit Market</button>
    <button id="runShopStandardButton" style="margin-top: 10px;">Run Shop (Standard Rate)</button>
    <button id="longRestButton" style="margin-top: 10px;">Take Long Rest (8 Hours)</button>
    <button id="runShopBarterButton" style="margin-top: 10px;">Run Shop (Barter Mode)</button>

    <hr>
    <h2>Test HP</h2>
    <button id="testDamageButton" style="margin-top: 10px;">Take 3 Damage</button>
    <button id="testHealButton" style="margin-top: 10px;">Heal 3 HP</button>

    <hr>
    <div id="shopMessageDisplay" style="margin-top: 10px; padding: 10px; border: 1px dashed #ccc;">
        <!-- Shop operation messages will be displayed here -->
    </div>

    <div id="barterUIDisplay" style="margin-top: 10px; padding: 10px; border: 1px solid #444;">
        <!-- Barter UI will be displayed here -->
    </div>

    <div id="marketDisplay" style="margin-top: 20px;">
        <!-- Market items will be displayed here -->
    </div>

    <script src="app.js"></script>
</body>
</html>
